name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # PluginVersion feeds the Claude Code plugin manifest, which users install

      # independently of the binary. A tag that disagrees with it would publish a

      # plugin claiming the wrong version.

      - name: Verify the tag matches PluginVersion

        run: |

          tag="${GITHUB_REF_NAME#v}"

          declared=$(grep -oE 'PluginVersion = "[^"]+"' cmd/root.go | cut -d'"' -f2)

          if [ "$tag" != "$declared" ]; then

            echo "::error::tag $GITHUB_REF_NAME disagrees with PluginVersion ($declared)"

            exit 1

          fi


      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
